# Cổng vào duy nhất cho App Flutter khi truy cập từ ngoài mạng LAN (ngrok trỏ vào cổng 8080):
#   /ws  -> Realtime Server (WebSocket)
#   /    -> Mobile Backend (REST API + ảnh uploads)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    client_max_body_size 10m;

    location /ws {
        proxy_pass http://realtime:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://mobile_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
