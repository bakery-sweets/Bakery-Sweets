# ==============================================================================
# THE SWEETS — Docker Compose
# Kiến trúc Client–Server nhiều tầng:
#   Tầng trình bày (Client):
#     - Web:    React (port 3000)
#     - Mobile: Flutter (chạy trên thiết bị)
#   Tầng ứng dụng (Server):
#     - web_backend:    Python FastAPI (port 5000) — API cho Web (Admin + Storefront)
#     - mobile_backend: Python FastAPI (port 8000) — API cho App Flutter
#     - realtime:       Python FastAPI WebSocket (port 8001) — đẩy sự kiện tới Web & App
#     - mobile_gateway: Nginx (port 8080) — cổng vào duy nhất cho App khi đi qua ngrok
#                       (/ws -> realtime, còn lại -> mobile_backend)
#   Tầng dữ liệu:
#     - db: MariaDB 10.11 (port 3308)
#
# Mật khẩu & khóa bí mật đọc từ file .env cạnh file này (xem .env.example).
# ORM models dùng chung nằm ở common/ và được nạp vào cả 3 server Python.
# ==============================================================================

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-thesweets_db}
  DB_USER: ${DB_USER:-user}
  DB_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
  # Dùng chung giữa 3 server để token do backend nào cấp cũng mở được WebSocket
  SECRET_KEY: ${SECRET_KEY:?Thiếu SECRET_KEY trong .env}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Thiếu INTERNAL_API_KEY trong .env}
  PYTHONUNBUFFERED: "1"
  TZ: Asia/Ho_Chi_Minh

services:

  # ============================================================
  # DATABASE
  # ============================================================
  db:
    image: mariadb:10.11
    container_name: thesweets_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Thiếu DB_ROOT_PASSWORD trong .env}
      MYSQL_DATABASE: ${DB_NAME:-thesweets_db}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/createTable.sql:/docker-entrypoint-initdb.d/01_createTable.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    networks:
      - thesweets_network
    healthcheck:
      # $$ để biến được đọc trong container, không ghi mật khẩu vào file này
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # REALTIME — WebSocket Server (port 8001)
  # ============================================================
  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
      additional_contexts:
        common: ./common
    container_name: thesweets_realtime
    restart: always
    ports:
      - "8001:8001"
    environment:
      <<: *db-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./realtime:/app
      - ./common:/common
    networks:
      - thesweets_network

  # ============================================================
  # WEB — Python FastAPI Backend (port 5000)
  # ============================================================
  web_backend:
    build:
      context: ./web/backend
      dockerfile: Dockerfile
      additional_contexts:
        common: ./common
    container_name: thesweets_web_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      <<: *db-env
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      REALTIME_URL: http://realtime:8001
    depends_on:
      db:
        condition: service_healthy
      realtime:
        condition: service_started
    volumes:
      - ./web/backend:/app
      - ./common:/common
    networks:
      - thesweets_network

  # ============================================================
  # WEB — React Frontend (port 3000)
  # ============================================================
  web_frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
      # Vite gắn URL vào bundle lúc build (không đọc biến môi trường lúc chạy)
      args:
        - VITE_API_URL=http://localhost:5000/api
        - VITE_WS_URL=ws://localhost:8001/ws
    container_name: thesweets_web_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - web_backend
      - realtime
    networks:
      - thesweets_network

  # ============================================================
  # MOBILE — Python FastAPI Backend (port 8000)
  # ============================================================
  mobile_backend:
    build:
      context: ./mobile/backend
      dockerfile: Dockerfile
      additional_contexts:
        common: ./common
    container_name: thesweets_mobile_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      <<: *db-env
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      REALTIME_URL: http://realtime:8001
    depends_on:
      db:
        condition: service_healthy
      realtime:
        condition: service_started
    volumes:
      - ./mobile/backend:/app
      - ./common:/common
    networks:
      - thesweets_network

  # ============================================================
  # MOBILE — Gateway (port 8080): ngrok trỏ vào đây thay vì 8000
  # ============================================================
  mobile_gateway:
    image: nginx:alpine
    container_name: thesweets_mobile_gateway
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mobile_backend
      - realtime
    networks:
      - thesweets_network

# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  db_data:
    driver: local

networks:
  thesweets_network:
    driver: bridge
