# ==============================================================================
# THE SWEETS â€” Docker Compose
# Kiáº¿n trÃºc:
#   Web:    React (FE: port 3000) + C# ASP.NET Core (BE: port 5000)
#   Mobile: Flutter (FE - cháº¡y trÃªn thiáº¿t bá»‹) + Python FastAPI (BE: port 8000)
#   DB:     MariaDB 10.11 (port 3308)
#   Legacy: PHP Web cÅ© (port 8080)
# ==============================================================================

services:

  # ============================================================
  # DATABASE
  # ============================================================
  db:
    image: mariadb:10.11
    container_name: thesweets_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: thesweets_db
      MYSQL_USER: user
      MYSQL_PASSWORD: 123
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/createTable.sql:/docker-entrypoint-initdb.d/01_createTable.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    networks:
      - thesweets_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  # ============================================================
  # WEB â€” C# ASP.NET Core Backend (BE: port 5000)
  # ============================================================
  web_backend:
    build:
      context: ./web/backend
      dockerfile: Dockerfile
    container_name: thesweets_web_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=thesweets_db
      - DB_USER=user
      - DB_PASSWORD=123
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./web/backend:/src
    networks:
      - thesweets_network

  # ============================================================
  # WEB â€” React Frontend (FE: port 3000)
  # ============================================================
  web_frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    container_name: thesweets_web_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - web_backend
    volumes:
      - ./web/frontend:/app
      - /app/node_modules
    networks:
      - thesweets_network

  # ============================================================
  # MOBILE â€” Python FastAPI Backend (BE: port 8000)
  # ============================================================
  mobile_backend:
    build:
      context: ./mobile/backend
      dockerfile: Dockerfile
    container_name: thesweets_mobile_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=thesweets_db
      - DB_USER=user
      - DB_PASSWORD=123
      - SECRET_KEY=your_jwt_secret_key_here
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./mobile/backend:/app
    networks:
      - thesweets_network



# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  db_data:
    driver: local

networks:
  thesweets_network:
    driver: bridge
